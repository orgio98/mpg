<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MP4 Studio Lite — VLLO 스타일 정밀 다중 구간 편집기</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-alt: #263348;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
      --clip-panel-w: 320px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 20px 16px 48px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 18px;
    }

    header h1 {
      margin: 0;
      font-size: 1.38rem;
      letter-spacing: -0.02em;
    }

    .badge {
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.16);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.35);
    }

    /* 가로 레이아웃: 영상/타임라인 가변 확장 + 리사이저 + 클립 목록 */
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 10px var(--clip-panel-w);
      gap: 6px;
      align-items: start;
    }

    .workspace.clips-collapsed {
      grid-template-columns: minmax(0, 1fr) 0px 52px;
    }

    .resizer {
      height: 100%;
      min-height: 360px;
      cursor: col-resize;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      touch-action: none;
    }

    .resizer::after {
      content: "";
      width: 3px;
      height: 54px;
      border-radius: 999px;
      background: #475569;
      transition: background 0.15s, height 0.15s;
    }

    .resizer:hover::after,
    .resizer.dragging::after {
      background: var(--primary);
      height: 84px;
    }

    .workspace.clips-collapsed .resizer {
      display: none;
    }

    @media (max-width: 940px) {
      .workspace,
      .workspace.clips-collapsed {
        grid-template-columns: 1fr;
        gap: 14px;
      }
      .resizer {
        display: none;
      }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      min-width: 0;
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 1.02rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    /* 접힌 클립 목록 탭 스타일 */
    .clips-card.collapsed {
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .clips-card.collapsed .clips-body {
      display: none;
    }

    .clips-card.collapsed .clips-header {
      flex-direction: column;
      margin-bottom: 0;
      gap: 8px;
    }

    .vertical-label {
      display: none;
      writing-mode: vertical-rl;
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      user-select: none;
    }

    .clips-card.collapsed .vertical-label {
      display: block;
    }

    .clips-card.collapsed .clips-full-title {
      display: none;
    }

    .video-stage {
      position: relative;
      background: #000;
      border-radius: 8px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    video {
      width: 100%;
      max-height: 460px;
      display: block;
      background: #000;
    }

    .timecode-hud {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(9, 13, 22, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.3);
      padding: 3px 9px;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.82rem;
      color: #f8fafc;
      pointer-events: none;
    }

    .seq-banner {
      margin-top: 8px;
      padding: 7px 11px;
      border-radius: 8px;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.45);
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.82rem;
      color: #a7f3d0;
    }

    .seq-banner.active {
      display: flex;
    }

    /* ===== VLLO 스타일 확대/스크롤 필름스트립 타임라인 ===== */
    .vllo-editor {
      margin-top: 12px;
      background: var(--panel-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      user-select: none;
    }

    .vllo-editor.disabled {
      opacity: 0.45;
      pointer-events: none;
    }

    .vllo-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 0.8rem;
    }

    .zoom-control {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
    }

    .zoom-control input[type="range"] {
      width: 120px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .timeline-viewport {
      position: relative;
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 26px 18px 10px;
      touch-action: pan-x;
    }

    .timeline-canvas {
      position: relative;
      height: 76px;
      min-width: 100%;
    }

    .timeline-ruler {
      position: relative;
      height: 20px;
      border-bottom: 1px solid #334155;
      cursor: pointer;
    }

    .ruler-tick {
      position: absolute;
      bottom: 0;
      width: 1px;
      background: #475569;
      pointer-events: none;
    }

    .ruler-tick.major {
      height: 11px;
      background: #94a3b8;
    }

    .ruler-tick.minor {
      height: 5px;
    }

    .ruler-label {
      position: absolute;
      top: -17px;
      transform: translateX(-50%);
      font-size: 0.68rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      pointer-events: none;
    }

    .filmstrip-track {
      position: relative;
      height: 48px;
      margin-top: 4px;
      background: #111827;
      border-radius: 6px;
      border: 1px solid #334155;
      overflow: visible;
    }

    .filmstrip-thumbs {
      position: absolute;
      inset: 0;
      display: flex;
      overflow: hidden;
      border-radius: 5px;
      opacity: 0.68;
      pointer-events: none;
    }

    .filmstrip-thumbs img {
      height: 100%;
      flex: 1 1 0;
      min-width: 0;
      object-fit: cover;
      border-right: 1px solid rgba(15, 23, 42, 0.5);
    }

    .timeline-ghost-range {
      position: absolute;
      top: 0;
      height: 100%;
      background: rgba(148, 163, 184, 0.25);
      border-left: 1px dashed #cbd5e1;
      border-right: 1px dashed #cbd5e1;
      pointer-events: none;
      z-index: 2;
    }

    .timeline-range {
      position: absolute;
      top: -2px;
      height: calc(100% + 4px);
      background: rgba(245, 158, 11, 0.18);
      border-top: 3px solid var(--warn);
      border-bottom: 3px solid var(--warn);
      cursor: grab;
      z-index: 3;
    }

    .timeline-range:active {
      cursor: grabbing;
    }

    .timeline-handle {
      position: absolute;
      top: -3px;
      width: 16px;
      height: calc(100% + 6px);
      background: var(--warn);
      color: #111827;
      cursor: ew-resize;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.65);
      touch-action: none;
    }

    .handle-start {
      transform: translateX(-100%);
      border-radius: 6px 0 0 6px;
    }

    .handle-end {
      transform: translateX(0);
      border-radius: 0 6px 6px 0;
    }

    .timeline-handle::after {
      content: "";
      width: 3px;
      height: 18px;
      border-left: 1.5px solid #1e293b;
      border-right: 1.5px solid #1e293b;
    }

    .handle-tooltip {
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);
      background: #f59e0b;
      color: #090d16;
      font-weight: 700;
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s;
    }

    .timeline-handle:hover .handle-tooltip,
    .timeline-handle.dragging .handle-tooltip {
      opacity: 1;
    }

    .timeline-playhead {
      position: absolute;
      top: -22px;
      height: 74px;
      width: 2px;
      background: #ef4444;
      pointer-events: none;
      transform: translateX(-50%);
      z-index: 6;
    }

    .timeline-playhead::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid #ef4444;
    }

    /* ===== 프레임 단위 미세 조그(Jog) 패널 ===== */
    .jog-grid {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    @media (max-width: 600px) {
      .jog-grid { grid-template-columns: 1fr; }
    }

    .jog-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 10px;
    }

    .jog-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .jog-title strong {
      color: var(--text);
      font-variant-numeric: tabular-nums;
      font-size: 0.86rem;
    }

    .jog-buttons {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .jog-buttons button {
      flex: 1;
      padding: 5px 4px;
      font-size: 0.75rem;
      text-align: center;
    }

    .playhead-bar {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
    }

    .playhead-bar .jog-group {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .playhead-bar button {
      padding: 5px 8px;
      font-size: 0.76rem;
    }

    /* ===== 선택 구간 리스트 ===== */
    .ranges-panel {
      margin-top: 12px;
      background: var(--panel-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }

    .ranges-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .ranges-head-title {
      font-size: 0.86rem;
      font-weight: 600;
    }

    .range-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 175px;
      overflow-y: auto;
    }

    .range-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 7px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-size: 0.82rem;
      cursor: pointer;
    }

    .range-item.active {
      border-color: var(--warn);
      background: rgba(245, 158, 11, 0.12);
    }

    .range-item.disabled-range {
      opacity: 0.55;
    }

    .range-item-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .range-item-left input[type="checkbox"] {
      accent-color: var(--accent);
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    .range-item-info {
      font-variant-numeric: tabular-nums;
    }

    .range-item-actions {
      display: flex;
      gap: 4px;
    }

    .range-item-actions button {
      padding: 3px 7px;
      font-size: 0.74rem;
    }

    .seq-controls {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 0.88rem;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--panel-alt);
      color: var(--text);
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 0.84rem;
      font-weight: 500;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }

    button:hover:not(:disabled) {
      background: #334155;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    button.primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    button.accent {
      background: var(--accent);
      border-color: var(--accent);
      color: #06281e;
      font-weight: 600;
    }

    button.warn {
      background: rgba(245, 158, 11, 0.18);
      border-color: rgba(245, 158, 11, 0.5);
      color: #fcd34d;
    }

    button.split-btn {
      background: rgba(16, 185, 129, 0.16);
      border-color: rgba(16, 185, 129, 0.5);
      color: #6ee7b7;
    }

    button.danger {
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.4);
    }

    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 12px;
